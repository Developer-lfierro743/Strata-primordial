name: Build Strata

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-linux-x64:
    name: Build linuxX64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libc6-dev linux-libc-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libudev-dev libdrm-dev libgbm-dev libvulkan-dev

      - name: Build SDL3 from source
        run: |
          git clone --branch release-3.2.6 --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          mkdir -p /tmp/SDL/build && cd /tmp/SDL/build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build . --parallel $(nproc)
          sudo cmake --install .
          sudo ldconfig

      - name: Build linuxX64
        run: ./gradlew :linkDebugExecutableLinuxX64

      - name: Upload linuxX64 binary
        uses: actions/upload-artifact@v4
        with:
          name: strata-linux-x64
          path: build/bin/linuxX64/debugExecutable/

  build-windows:
    name: Build Windows (mingwX64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDL3 + Vulkan SDK
        run: |
          # Install Vulkan SDK
          $vulkanSdkUrl = "https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/VulkanSDK-1.4.357.0-Installer.exe"
          Invoke-WebRequest -Uri $vulkanSdkUrl -OutFile "VulkanSDK-Installer.exe"
          Start-Process -FilePath ".\VulkanSDK-Installer.exe" -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          $env:VULKAN_SDK = "C:\VulkanSDK\1.4.357.0"
          Write-Output "VULKAN_SDK=$env:VULKAN_SDK" >> $env:GITHUB_ENV
          
          # Install SDL3 via vcpkg
          vcpkg install sdl3:x64-windows
          
          # Set SDL3 paths
          $env:SDL3_INCLUDE = "C:\vcpkg\installed\x64-windows\include"
          $env:SDL3_LIB = "C:\vcpkg\installed\x64-windows\lib"
          Write-Output "SDL3_INCLUDE=$env:SDL3_INCLUDE" >> $env:GITHUB_ENV
          Write-Output "SDL3_LIB=$env:SDL3_LIB" >> $env:GITHUB_ENV

      - name: Build Windows
        run: ./gradlew :linkDebugExecutableDesktop
        env:
          SDL3_INCLUDE: ${{ env.SDL3_INCLUDE }}
          SDL3_LIB: ${{ env.SDL3_LIB }}
          VULKAN_INCLUDE: ${{ env.VULKAN_SDK }}\Include
          VULKAN_LIB: ${{ env.VULKAN_SDK }}\Lib
          VMA_INCLUDE: ${{ github.workspace }}\src\nativeInterop\cinterop

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: strata-windows
          path: build/bin/desktop/debugExecutable/

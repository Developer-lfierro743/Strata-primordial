name: Build Strata

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-linux-x64:
    name: Build linuxX64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libc6-dev linux-libc-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libudev-dev libdrm-dev libgbm-dev libvulkan-dev

      - name: Build SDL3 from source
        run: |
          git clone --branch release-3.2.6 --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          mkdir -p /tmp/SDL/build && cd /tmp/SDL/build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE=ON \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build . --parallel $(nproc)
          sudo cmake --install .
          sudo ldconfig

      - name: Build linuxX64
        run: ./gradlew :linkDebugExecutableLinuxX64

      - name: Upload linuxX64 binary
        uses: actions/upload-artifact@v4
        with:
          name: strata-linux-x64
          path: build/bin/linuxX64/debugExecutable/

  build-linux-arm64:
    name: Build linuxArm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install cross-compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libvulkan-dev

      - name: Build SDL3 for ARM64
        run: |
          git clone --branch release-3.2.6 --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          mkdir -p /tmp/SDL/build && cd /tmp/SDL/build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE=ON \
            -DCMAKE_INSTALL_PREFIX=/usr/aarch64-linux-gnu
          cmake --build . --parallel $(nproc)
          sudo cmake --install .
          sudo ldconfig

      - name: Build linuxArm64
        run: ./gradlew :linkDebugExecutableLinuxArm64

      - name: Upload linuxArm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: strata-linux-arm64
          path: build/bin/linuxArm64/debugExecutable/

  build-windows:
    name: Build Windows (mingwX64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDL3 (vcpkg)
        run: |
          vcpkg install sdl3:x64-windows

      - name: Build Windows
        run: ./gradlew :linkDebugExecutableDesktop

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: strata-windows
          path: build/bin/desktop/debugExecutable/

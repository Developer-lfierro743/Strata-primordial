name: Build Strata Primordial

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-linux-arm64:
    name: Build linuxArm64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install ARM64 cross-compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libudev-dev libdrm-dev libgbm-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # Cross-compile SDL3 for ARM64 (without X11/Wayland for cross-compile)
          git clone --branch release-3.2.6 --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          mkdir -p /tmp/SDL/build-arm64
          cd /tmp/SDL/build-arm64
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/aarch64-linux-gnu \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF
          cmake --build . --parallel $(nproc)
          sudo cmake --install .
          sudo ldconfig

      - name: Build linuxArm64 release
        run: ./gradlew linkReleaseExecutableLinuxArm64

      - name: Upload linuxArm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: strata-linux-arm64
          path: build/bin/linuxArm64/releaseExecutable/strata-prototype.kexe
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/linuxArm64/releaseExecutable/strata-prototype.kexe
          generate_release_notes: true

  build-linux-x64:
    name: Build linuxX64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install x64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libudev-dev libdrm-dev libgbm-dev
          # Build SDL3 from source for x86_64 (not in Ubuntu repos yet)
          git clone --branch release-3.2.6 --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build /tmp/SDL/build --parallel $(nproc)
          sudo cmake --install /tmp/SDL/build
          sudo ldconfig

      - name: Build linuxX64 release
        run: ./gradlew linkReleaseExecutableLinuxX64

      - name: Upload linuxX64 binary
        uses: actions/upload-artifact@v4
        with:
          name: strata-linux-x64
          path: build/bin/linuxX64/releaseExecutable/strata-prototype.kexe
          retention-days: 30

  build-windows:
    name: Build Windows (mingwX64)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install SDL3 (via vcpkg)
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.bat
          ./vcpkg/vcpkg install sdl3:x64-windows vulkan:x64-windows

      - name: Build Windows release
        run: ./gradlew.bat linkReleaseExecutableDesktop

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: strata-windows-x64
          path: build/bin/desktop/releaseExecutable/strata-prototype.exe
          retention-days: 30